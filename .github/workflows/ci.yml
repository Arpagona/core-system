name: Validation produit
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Tests API
        working-directory: services/arpagona-api
        run: /usr/bin/python3 -m unittest discover -s tests
      - name: Tests passerelle Kanban
        run: /usr/bin/python3 -m unittest discover -s services/kanban-bridge/tests
      - name: Tests portier Hindsight (une banque par utilisateur)
        working-directory: services/hindsight-gate
        run: PYTHONPATH=. /usr/bin/python3 -m unittest discover -s tests
      - name: Compiler les plugins, la recette d'isolation et les outils de développement
        run: /usr/bin/python3 -m py_compile plugins/arpagona-core/__init__.py plugins/arpagona-mail/__init__.py tests/e2e/isolation_agents.py dev/*.py
      - name: Syntaxe des scripts de déploiement des agents personnels
        run: bash -n deploy/atlas/agents-perso.sh && bash -n deploy/atlas/rollback-agents-perso.sh
      - name: Parcours complet sur poste local (moteur et Kanban simulés)
        run: /usr/bin/python3 -m unittest discover -s tests/dev -v
      - name: Contrôles de sécurité ciblés
        run: /usr/bin/python3 scripts/security_checks.py
      - name: Vérifier JavaScript
        run: node --check apps/mission-control-web/app.js
      - name: Vérifier les espaces
        run: git diff --check
