name: Guardian déterministe
on:
  pull_request:
permissions:
  contents: read
jobs:
  guardian:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - run: rustup toolchain install 1.95.0 --profile minimal
      - name: Générer rapport sans supposer CI verte
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/guardian.py --base "$BASE_SHA" --ci unknown > guardian-report.json
      - name: Publier le rapport comme artefact privé
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: guardian-${{ github.event.pull_request.head.sha }}
          path: guardian-report.json
          if-no-files-found: error
          retention-days: 7
