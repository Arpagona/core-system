# Proxy autonome, aucun port nouveau : les ports existants deviennent HTTPS.
worker_processes 1;
pid /run/arpagona-tls/nginx.pid;
error_log stderr warn;
events { worker_connections 256; }
http {
    access_log off;
    client_max_body_size 110m;
    ssl_certificate /etc/arpagona-tls/server.crt;
    ssl_certificate_key /etc/arpagona-tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    proxy_buffering off;
    proxy_read_timeout 900s;
    proxy_http_version 1.1;
    proxy_cookie_flags ~ secure httponly samesite=strict;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP $remote_addr;
    server {
        listen 192.168.68.240:8700 ssl;
        listen 10.68.100.1:8700 ssl;
        server_name _;
        allow 192.168.68.0/24;
        allow 10.68.100.0/24;
        deny all;
        error_page 497 =308 https://$http_host$request_uri;
        add_header Strict-Transport-Security 'max-age=3600' always;
        location / { proxy_pass http://127.0.0.1:8700; }
    }
    server {
        listen 10.68.100.1:8710 ssl;
        server_name _;
        allow 10.68.100.3;
        deny all;
        error_page 497 =308 https://$http_host$request_uri;
        add_header Strict-Transport-Security 'max-age=3600' always;
        location / { proxy_pass http://127.0.0.1:18710; }
    }
}
